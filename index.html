<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mafia: The City of Lost Heaven — 3D Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Charm:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Subtle Warm Edge Vignette -->
    <div class="vignette-overlay"></div>

    <!-- Top-Right HUD Controls (Sound & Camera Tuner) -->
    <header class="hud-top">
      <div class="hud-controls">
        <button id="btn-pan-tour" class="hud-btn" title="Play Camera Pan across Desk like Video">
          <span>▶ PLAY VIDEO PAN</span>
        </button>
        <button id="btn-audio" class="hud-btn" title="Toggle Vladimir Simunek Main Theme">
          <span class="led-dot" id="audio-led"></span>
          <span id="audio-label">MUSIC: CLICK TO PLAY</span>
        </button>
        <button id="btn-debug" class="hud-btn" title="Toggle Camera Waypoint Tuner [C]">
          <span>CAMERA TUNER [C]</span>
        </button>
      </div>
    </header>

    <!-- Authentic Mafia 1 Top-Left Crumpled Paper Main Menu (Matches Screenshot) -->
    <aside id="main-menu" class="mafia-paper-menu">
      <!-- Iconic Silver Wire Paperclip on Top-Left Corner -->
      <svg class="menu-paperclip" viewBox="0 0 64 120" width="38" height="72" aria-hidden="true">
        <path
          d="M 42 18 L 16 76 A 14 14 0 0 0 42 88 L 56 32 A 10 10 0 0 0 38 22 L 24 68 A 6 6 0 0 0 35 73 L 46 36"
          fill="none"
          stroke="#a8a6a0"
          stroke-width="3.6"
          stroke-linecap="round"
        />
      </svg>
      <div class="paper-header">
        <h1 id="site-title" class="paper-title">Main Menu:</h1>
      </div>

      <div class="paper-body">
        <nav id="menu-nav" class="paper-menu-list" aria-label="Main Menu">
          <!-- Populated dynamically from src/config.js -->
        </nav>

        <!-- Iconic Two Little Black Shoeprints in Bottom-Right Corner -->
        <div class="shoeprints" aria-hidden="true" title="Lost Heaven">
          <svg viewBox="0 0 36 36" width="24" height="24">
            <ellipse cx="12" cy="14" rx="4.2" ry="7.5" transform="rotate(-12 12 14)" fill="#1c1c1c" />
            <circle cx="13.5" cy="24.5" r="3.2" fill="#1c1c1c" />
            <ellipse cx="23" cy="11" rx="4.2" ry="7.5" transform="rotate(8 23 11)" fill="#1c1c1c" />
            <circle cx="22" cy="21.5" r="3.2" fill="#1c1c1c" />
          </svg>
        </div>
      </div>
    </aside>

    <!-- Hover Tooltip for 3D Desk Objects -->
    <div id="object-tooltip" class="object-tooltip hidden">
      <span id="tooltip-title" class="tooltip-title"></span>
      <span id="tooltip-sub" class="tooltip-sub"></span>
    </div>

    <!-- Zoomed-In Dossier / Content Modal Panel -->
    <section id="section-panel" class="section-panel hidden" aria-live="polite">
      <div class="dossier-card">
        <div class="dossier-header">
          <div>
            <span id="panel-kicker" class="dossier-kicker">FILE NO. 1930-A</span>
            <h2 id="panel-title" class="dossier-title">DOSSIER</h2>
          </div>
          <button id="btn-back" class="btn-return" title="Return to Desk [ESC]">
            ← MAIN DESK <span class="key-hint">[ESC]</span>
          </button>
        </div>
        <div class="dossier-divider"></div>
        <div id="panel-body" class="dossier-body">
          <!-- Populated from src/config.js -->
        </div>
      </div>
    </section>

    <!-- Live Camera & Scene Tuner -->
    <aside id="debug-panel" class="debug-panel hidden">
      <div class="debug-title">CAMERA &amp; SCENE TUNER</div>
      <div class="debug-row">
        <span>Active Section:</span>
        <strong id="dbg-section">overview</strong>
      </div>
      <div class="debug-row">
        <span>Cam Pos:</span>
        <code id="dbg-pos">0, 0, 0</code>
      </div>
      <div class="debug-row">
        <span>LookAt Target:</span>
        <code id="dbg-target">0, 0, 0</code>
      </div>
      <div class="debug-sliders">
        <label>Cam X <input type="range" id="sl-cam-x" min="-3" max="3" step="0.02" /></label>
        <label>Cam Y <input type="range" id="sl-cam-y" min="0.85" max="3" step="0.02" /></label>
        <label>Cam Z <input type="range" id="sl-cam-z" min="-1" max="3" step="0.02" /></label>
        <label>Target X <input type="range" id="sl-tar-x" min="-2" max="2" step="0.02" /></label>
        <label>Target Y <input type="range" id="sl-tar-y" min="0.5" max="2" step="0.02" /></label>
        <label>Target Z <input type="range" id="sl-tar-z" min="-2" max="2" step="0.02" /></label>
      </div>
      <button id="btn-copy-cam" class="hud-btn full-width">COPY CONFIG SNIPPET</button>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
